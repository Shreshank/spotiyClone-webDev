<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/utility.css" />
</head>

<body>
    <div class="mainContanier flex bg-black">
        <div class="left">
            <div class="close">
                <img width="35" class="invert" src="./img/close.svg" alt="close">
            </div>
            <div class="home bg-grey rounded m-1 p-1">
                <div class="logo">
                    <img width="150" class="invert" src="./img/logo.svg" alt="Logo" />
                </div>
                <ul>
                    <li><img class="invert" src="./img/home.svg" alt="Home" />Home</li>
                    <li><img class="invert" src="./img/search.svg" alt="Search" />Search</li>
                </ul>
            </div>

            <div class="library bg-grey rounded m-1 p-1">
                <div class="heading">
                    <img class="invert" src="./img/playlist.svg" alt="Playlist" />
                    <h2>Your Library</h2>
                </div>
                <div class="songList">
                    <ul>
                    </ul>
                </div>
                <div class="footer">
                    <div><a href="https://www.spotify.com/in-en/legal/" target="_blank">Legal</a></div>
                    <div><a href="https://www.spotify.com/in-en/safetyandprivacy/" target="_blank">Safety & Privacy Center</a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/" target="_blank">Privacy Policy</a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/cookies-policy/" target="_blank">Cookies</a></div>
                    <div><a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3" target="_blank">About Ads</a></div>
                    <div><a href="https://www.spotify.com/in-en/accessibility/" target="_blank">Accessibility</a></div>
                </div>
            </div>
        </div>

        <div class="right bg-grey rounded">
            <div class="header">
                <div class="nav">
                    <div class="hamburger">
                        <img width="35" class="invert" src="./img/hamburger.svg" alt="hamburger">
                    </div>
                    <svg class="nav-svg" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <svg class="nav-svg" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="headBtn">
                    <button class="invert">Sign up</button>
                    <button>Log in</button>
                </div>
            </div>

            <div class="spotifyPlaylist">
                <h2>Spotify Playlist</h2>
                <div class="cardContainer"></div>
            </div>

            <div class="playBar">
                <div class="playBar2">
                    <div class="song-name"></div>
                    <div class="songButton">
                        <img id="prev" src="./img/prevsong.svg" alt="">
                        <img id="playpause" src="./img/play.svg" alt="">
                        <img id="next" src="./img/nextsong.svg" alt="">
                    </div>
                    <div class="songtime"></div>
                    <div class="volumeBar">
                        <label for="volume-slider"><img width="24" height="24" src="./img/volume.svg" alt=""></label>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
                <div class="seekbar">
                    <div class="circle"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
<!-- consider webHostMost for hosting -->
<!-- use cltr+shift+i or more tools in three dots to open inspect in case right click is closed -->
